name: ci


on: push:

jobs: 
  linting:
    runs-on: ubuntu-latest
    steps:
      -name: code checkout
       uses: actions/checkout@v3
      -name: install python
        uses: actions/setup-python@v3
          python-version: 3.10
      -name:install flake8
        python -m pip install --upgrade pip
        run: pip install flake8
      -name: run flake8
        run: flake8 sum.py