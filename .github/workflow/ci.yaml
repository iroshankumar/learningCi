name: Basic CI

on:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ${ { matrix.os }  }
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -R

      - name: Check Python
        run: python --version